<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增／編輯物件 | One Third Residence Taiwan後台</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: #F0EEEA; min-height: 100vh; }
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--charcoal); flex-shrink: 0; display: flex; flex-direction: column; }
    .sidebar__logo { padding: 1.75rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar__logo-cn { font-family: var(--font-serif); font-size: 1.25rem; color: var(--white); display: block; }
    .sidebar__logo-en { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); display: block; margin-top: 3px; }
    .sidebar__label { font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 1.5rem 1.5rem 0.5rem; }
    .sidebar__nav { display: flex; flex-direction: column; }
    .sidebar__link { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1.5rem; font-size: 0.85rem; color: rgba(255,255,255,0.6); transition: var(--trans); }
    .sidebar__link:hover, .sidebar__link.active { color: var(--white); background: rgba(255,255,255,0.06); }
    .sidebar__link.active { border-left: 2px solid var(--gold); }
    .sidebar__footer { margin-top: auto; padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.08); }
    .sidebar__logout { font-size: 0.8rem; color: rgba(255,255,255,0.4); display: flex; align-items: center; gap: 0.5rem; transition: color var(--trans); }
    .sidebar__logout:hover { color: rgba(255,255,255,0.8); }

    .admin-main { flex: 1; overflow-y: auto; }
    .admin-header { background: var(--white); border-bottom: 1px solid var(--gray-200); padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .admin-header__title { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400; }
    .admin-content { padding: 2rem; }

    .form-wrap { background: var(--white); border: 1px solid var(--gray-200); padding: 2rem; }
    .form-section { margin-bottom: 2.5rem; padding-bottom: 2.5rem; border-bottom: 1px solid var(--gray-100); }
    .form-section:last-child { border-bottom: none; margin-bottom: 0; }
    .form-section__title { font-family: var(--font-serif); font-size: 1.15rem; margin-bottom: 1.5rem; color: var(--charcoal); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    .form-full { grid-column: 1 / -1; }

    /* Image upload */
    .upload-area { border: 2px dashed var(--gray-200); padding: 2rem; text-align: center; transition: border-color var(--trans); cursor: pointer; }
    .upload-area:hover, .upload-area.drag-over { border-color: var(--gold); }
    .upload-area input { display: none; }
    .upload-area p { font-size: 0.85rem; color: var(--gray-600); margin-top: 0.5rem; }
    .image-previews { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
    .image-preview { position: relative; width: 100px; height: 80px; }
    .image-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-preview__remove { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; background: #ef4444; color: #fff; border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1; }
    .image-preview--main::after { content: 'Main'; position: absolute; bottom: 0; left: 0; right: 0; background: rgba(184,151,90,0.9); color: #fff; font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; padding: 2px; }

    .success-bar { background: #ecfdf5; border-left: 2px solid #22c55e; padding: 0.75rem 1rem; font-size: 0.85rem; color: #15803d; margin-bottom: 1.5rem; display: none; }
    .error-bar { background: #fef2f2; border-left: 2px solid #f44336; padding: 0.75rem 1rem; font-size: 0.85rem; color: #c62828; margin-bottom: 1.5rem; display: none; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar__logo">
      <!-- LOGO：同 public/images/logo.png -->
      <img src="/images/logo.png" alt="One Third Residence Taiwan" class="nav__logo-img nav__logo-img--sidebar">
      <span class="nav__logo-fallback">
        <span class="sidebar__logo-cn">ONE THIRD</span>
        <span class="sidebar__logo-en">RESIDENCE TAIWAN</span>
      </span>
    </div>
    <div class="sidebar__label">管理</div>
    <nav class="sidebar__nav">
      <a href="/admin/index.html" class="sidebar__link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        儀表板
      </a>
      <a href="/admin/properties.html" class="sidebar__link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        物件管理
      </a>
      <a href="/admin/property-form.html" class="sidebar__link active">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        新增物件
      </a>
      <a href="/admin/site-content.html" class="sidebar__link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        前台內容
      </a>
      <a href="/admin/account.html" class="sidebar__link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        帳號設定
      </a>
      <div class="sidebar__label">網站</div>
      <a href="/index.html" target="_blank" class="sidebar__link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        前往前台
      </a>
    </nav>
    <div class="sidebar__footer">
      <a href="#" class="sidebar__logout" id="logoutBtn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        登出
      </a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h1 class="admin-header__title" id="pageTitle">新增物件</h1>
      <a href="/admin/properties.html" class="btn btn--outline-dark btn--sm">← 返回物件列表</a>
    </header>

    <div class="admin-content">
      <div class="success-bar" id="successBar"></div>
      <div class="error-bar" id="errorBar"></div>

      <form id="propertyForm" class="form-wrap">

        <!-- Basic info -->
        <div class="form-section">
          <h3 class="form-section__title">基本資訊</h3>
          <div class="form-group">
            <label>城市 / 地區 *</label>
            <select class="form-control" id="city">
              <option value="hakuba">白馬村（日本長野縣）</option>
              <option value="tokyo">東京（日本東京都）</option>
              <option value="dubai">杜拜（阿聯酋）</option>
            </select>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>物件英文名稱 *</label>
              <input type="text" class="form-control" id="name" required placeholder="e.g. Slopefront Villa">
            </div>
            <div class="form-group">
              <label>物件中文名稱 *</label>
              <input type="text" class="form-control" id="nameZh" required placeholder="e.g. 滑雪道直通別墅">
            </div>
            <div class="form-group">
              <label>物件 ID（英文+連字符）*</label>
              <input type="text" class="form-control" id="propId" required placeholder="e.g. slopefront-villa-1" pattern="[a-z0-9\-]+">
            </div>
            <div class="form-group">
              <label>所在地點</label>
              <input type="text" class="form-control" id="location" placeholder="e.g. 白馬五竜 Hakuba Goryu">
            </div>
            <div class="form-group">
              <label>物件類型</label>
              <select class="form-control" id="type">
                <option value="villa">別墅 (Villa)</option>
                <option value="resort">度假村 (Resort)</option>
                <option value="apartment">公寓 (Apartment)</option>
              </select>
            </div>
            <div class="form-group">
              <label>銷售狀態</label>
              <select class="form-control" id="status">
                <option value="available">可購入</option>
                <option value="coming-soon">即將推出</option>
                <option value="sold">已售出</option>
              </select>
            </div>
            <div class="form-group">
              <label>售價顯示文字</label>
              <input type="text" class="form-control" id="priceDisplay" placeholder="e.g. 詢價 / JPY 150,000,000">
            </div>
            <div class="form-group">
              <label>亮點標語（顯示於卡片角標）</label>
              <input type="text" class="form-control" id="highlight" placeholder="e.g. Ski-in / Ski-out">
            </div>
          </div>
          <div class="form-group" style="margin-top:0.5rem;">
            <label style="display:flex;align-items:center;gap:0.6rem;cursor:pointer;">
              <input type="checkbox" id="featured" style="accent-color:var(--gold);">
              <span>設為精選物件（顯示於首頁）</span>
            </label>
          </div>
        </div>

        <!-- Specs -->
        <div class="form-section">
          <h3 class="form-section__title">物件規格</h3>
          <div class="form-grid-3">
            <div class="form-group">
              <label>臥室數量</label>
              <input type="number" class="form-control" id="bedrooms" min="0" placeholder="3">
            </div>
            <div class="form-group">
              <label>衛浴數量</label>
              <input type="number" class="form-control" id="bathrooms" min="0" placeholder="2">
            </div>
            <div class="form-group">
              <label>樓層數</label>
              <input type="number" class="form-control" id="floors" min="1" placeholder="2">
            </div>
            <div class="form-group">
              <label>室內面積（m²）</label>
              <input type="number" class="form-control" id="area" min="0" placeholder="180">
            </div>
            <div class="form-group">
              <label>建造年份</label>
              <input type="number" class="form-control" id="yearBuilt" min="1900" max="2100" placeholder="2024">
            </div>
          </div>
        </div>

        <!-- Description -->
        <div class="form-section">
          <h3 class="form-section__title">物件描述</h3>
          <div class="form-group">
            <label>中文描述 *</label>
            <textarea class="form-control" id="descriptionZh" rows="5" placeholder="詳細描述物件特色、地理位置、生活機能等…"></textarea>
          </div>
          <div class="form-group">
            <label>英文描述</label>
            <textarea class="form-control" id="descriptionEn" rows="4" placeholder="English description…"></textarea>
          </div>
          <div class="form-group">
            <label>特色列表（每行一項，或以逗號分隔）</label>
            <textarea class="form-control" id="features" rows="4" placeholder="Ski-in / Ski-out&#10;開放式廚房&#10;設計師家具&#10;山景景觀窗"></textarea>
          </div>
        </div>

        <!-- Images -->
        <div class="form-section">
          <h3 class="form-section__title">物件圖片</h3>
          <p style="font-size:0.82rem;color:var(--gray-600);margin-bottom:1rem;">第一張圖片將作為縮圖顯示。建議上傳 3-8 張，格式：JPG/PNG，每張最大 10MB。</p>

          <div class="upload-area" id="uploadArea">
            <input type="file" id="imageInput" accept="image/*" multiple>
            <svg width="32" height="32" fill="none" stroke="var(--gold)" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto;"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <p>點擊或拖曳圖片至此處上傳</p>
            <p style="font-size:0.75rem;color:var(--gray-400);">支援 JPG、PNG、WEBP</p>
          </div>
          <div class="image-previews" id="imagePreviews"></div>
          <input type="hidden" id="imagesData"> <!-- stores JSON array of URLs -->
        </div>

        <!-- Submit -->
        <div style="display:flex;gap:1rem;align-items:center;">
          <button type="submit" class="btn btn--gold" id="submitBtn">儲存物件</button>
          <a href="/admin/properties.html" class="btn btn--outline-dark">取消</a>
          <span id="savingMsg" style="font-size:0.85rem;color:var(--gray-400);display:none;">儲存中…</span>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
fetch('/api/auth/me').then(r => r.json()).then(d => { if (!d.isAdmin) location.href = '/admin/login.html'; });

const params = new URLSearchParams(location.search);
const editId = params.get('id');
let uploadedImages = []; // array of URL strings

// Pre-fill city from URL param (for new property)
const cityFromUrl = params.get('city');
if (cityFromUrl) { const s = document.getElementById('city'); if (s) s.value = cityFromUrl; }

// If editing, load existing data
if (editId) {
  document.getElementById('pageTitle').textContent = '編輯物件';
  fetch(`/api/properties/${editId}`).then(r => r.json()).then(p => {
    document.getElementById('city').value = p.city || 'hakuba';
    document.getElementById('name').value = p.name || '';
    document.getElementById('nameZh').value = p.nameZh || '';
    document.getElementById('propId').value = p.id || '';
    document.getElementById('propId').readOnly = true;
    document.getElementById('location').value = p.location || '';
    document.getElementById('type').value = p.type || 'villa';
    document.getElementById('status').value = p.status || 'available';
    document.getElementById('priceDisplay').value = p.priceDisplay || '';
    document.getElementById('highlight').value = p.highlight || '';
    document.getElementById('featured').checked = !!p.featured;
    document.getElementById('bedrooms').value = p.bedrooms ?? '';
    document.getElementById('bathrooms').value = p.bathrooms ?? '';
    document.getElementById('floors').value = p.floors ?? '';
    document.getElementById('area').value = p.area ?? '';
    document.getElementById('yearBuilt').value = p.yearBuilt ?? '';
    document.getElementById('descriptionZh').value = p.descriptionZh || '';
    document.getElementById('descriptionEn').value = p.descriptionEn || '';
    document.getElementById('features').value = (p.features || []).join('\n');

    uploadedImages = p.images ? [...p.images] : [];
    if (p.thumbnail && !uploadedImages.includes(p.thumbnail)) uploadedImages.unshift(p.thumbnail);
    renderPreviews();
  });
}

// Image upload
const uploadArea = document.getElementById('uploadArea');
const imageInput = document.getElementById('imageInput');

uploadArea.addEventListener('click', () => imageInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('drag-over');
  uploadFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
});
imageInput.addEventListener('change', () => {
  uploadFiles(Array.from(imageInput.files));
  imageInput.value = '';
});

async function uploadFiles(files) {
  for (const file of files) {
    const fd = new FormData();
    fd.append('image', file);
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.url) { uploadedImages.push(data.url); renderPreviews(); }
  }
}

function renderPreviews() {
  const container = document.getElementById('imagePreviews');
  container.innerHTML = uploadedImages.map((url, i) => `
    <div class="image-preview ${i === 0 ? 'image-preview--main' : ''}">
      <img src="${url}" alt="">
      <span class="image-preview__remove" onclick="removeImage(${i})">×</span>
    </div>
  `).join('');
}

function removeImage(idx) {
  uploadedImages.splice(idx, 1);
  renderPreviews();
}

// Submit form
document.getElementById('propertyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const saving = document.getElementById('savingMsg');
  const errBar = document.getElementById('errorBar');
  const okBar = document.getElementById('successBar');
  btn.disabled = true; saving.style.display = 'inline'; errBar.style.display = 'none'; okBar.style.display = 'none';

  const featuresRaw = document.getElementById('features').value;
  const features = featuresRaw.includes('\n')
    ? featuresRaw.split('\n').map(f => f.trim()).filter(Boolean)
    : featuresRaw.split(',').map(f => f.trim()).filter(Boolean);

  const payload = {
    id: document.getElementById('propId').value.trim(),
    city: document.getElementById('city').value,
    name: document.getElementById('name').value.trim(),
    nameZh: document.getElementById('nameZh').value.trim(),
    location: document.getElementById('location').value.trim(),
    type: document.getElementById('type').value,
    status: document.getElementById('status').value,
    priceDisplay: document.getElementById('priceDisplay').value.trim(),
    highlight: document.getElementById('highlight').value.trim(),
    featured: document.getElementById('featured').checked,
    bedrooms: document.getElementById('bedrooms').value || null,
    bathrooms: document.getElementById('bathrooms').value || null,
    floors: document.getElementById('floors').value || null,
    area: document.getElementById('area').value || null,
    yearBuilt: document.getElementById('yearBuilt').value || null,
    descriptionZh: document.getElementById('descriptionZh').value.trim(),
    descriptionEn: document.getElementById('descriptionEn').value.trim(),
    features,
    thumbnail: uploadedImages[0] || '',
    images: uploadedImages,
  };

  const method = editId ? 'PUT' : 'POST';
  const url = editId ? `/api/properties/${editId}` : '/api/properties';
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const data = await res.json();

  btn.disabled = false; saving.style.display = 'none';
  if (res.ok) {
    okBar.textContent = `物件「${data.nameZh}」已成功${editId ? '更新' : '新增'}。`;
    okBar.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (!editId) setTimeout(() => location.href = '/admin/properties.html', 1500);
  } else {
    errBar.textContent = data.error || '儲存失敗，請重試。';
    errBar.style.display = 'block';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/auth/logout', { method: 'POST' });
  location.href = '/admin/login.html';
});
</script>
</body>
</html>
